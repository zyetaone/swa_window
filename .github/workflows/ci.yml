name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege default token — only read access to repo contents.
# The promote job elevates to contents:write for itself only.
permissions:
  contents: read

# Serialise runs per ref so the release promotion below converges to the
# newest green sha. PRs cancel superseded runs; main runs all complete
# (cancelling a main run could skip a promotion).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-check:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # This project uses Bun, not npm. `bun.lock` is the authoritative
      # lockfile. `package-lock.json` may exist in the tree for historical
      # reasons but is not the source of truth for CI installs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
        run: bun run build

      # Boot the built artifact the way the Pi does (`bun run serve`, the exact
      # ExecStart of aero-app.service) and issue a real request. A green build
      # proves nothing about whether the server can SERVE it: server.ts once
      # wrapped adapter-node's Connect middleware as if it were a fetch handler,
      # so every request killed the process — a 10s systemd crash loop with a
      # dark kiosk, shipped through a fully green CI run. Only a real request
      # against a real build catches that class of bug.
      - name: Smoke test built server
        env:
          AERO_DISABLE_LAN_PROXY: '1'
          PORT: '3000'
        run: |
          bun run serve &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://localhost:3000/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://localhost:3000/api/status
          curl -fsS --max-time 5 -o /dev/null http://localhost:3000/
          # A second request proves the process survived the first, which is
          # precisely what the middleware-contract bug broke.
          curl -fsS --max-time 5 -o /dev/null http://localhost:3000/api/devices
          kill "$SERVER_PID"

  # ── Release promotion ────────────────────────────────────────────────────
  # The Pi fleet's daily updater tracks the `release` branch, NOT main.
  # This job is the deploy gate: only a green main run moves `release`.
  # A red commit on main simply never reaches the fleet.
  #
  # `release` is exclusively CI-owned — never push to it by hand. force=true
  # is correct here: the fleet consumes it with `git reset --hard`, so
  # non-fast-forward moves (e.g. after a main history rewrite) are absorbed.
  promote:
    name: Promote to release
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move release ref to ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/heads/release" --silent; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/release" \
              -f sha="${{ github.sha }}" -F force=true
          else
            # First green run bootstraps the branch.
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/release" -f sha="${{ github.sha }}"
          fi
